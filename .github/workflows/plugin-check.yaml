name: 'Plugin Check and WPCS Test'

on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  plugin-check:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Create a temporary working directory
      - name: Create Temporary Working Directory
        run: |
          mkdir temp_dir
          rsync -av --progress ./ temp_dir --exclude=node_modules --exclude=vendor --exclude=.git --exclude=.github --exclude=".*" --exclude=*.json --exclude=*.xml --exclude=*.lock --exclude=*.md
          cd temp_dir

      # Remove hidden files and other dev files (failsafe step)
      - name: Remove Dev and Hidden Files
        run: |
          find . -name ".*" -exec rm -rf {} \; || true
          rm -rf node_modules vendor .git .github *.gitignore *.zipignore composer.json phpmd.txt phpmd.xml package.json package-lock.json README.md

      # Setup PHP environment
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'

      # Install WPCS and run standards check
      - name: Install WPCS
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require "wp-coding-standards/wpcs"
          composer global require "dealerdirect/phpcodesniffer-composer-installer"

      # Run WPCS (WordPress PHP, JS, CSS Coding Standards Check)
      - name: Run WPCS
        run: ~/.composer/vendor/bin/phpcs --standard=WordPress --extensions=php,css . --ignore=vendor,node_modules,assets
        working-directory: temp_dir
        continue-on-error: true

      # Run Plugin Check
      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          path: temp_dir